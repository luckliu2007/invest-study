name: 🐛 脚本或 Notebook 报错
description: scripts/ 下的脚本、notebooks/ 下的 Notebook 或测试运行出错
title: "[报错] "
labels: ["bug"]
body:
  - type: input
    id: target
    attributes:
      label: 哪个脚本或 Notebook
      placeholder: 例如：scripts/optimize_portfolio.py
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 运行的命令
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 报错输出
      description: 粘贴完整的报错信息。不要贴出任何 API Key、Token 或账户信息。
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: 例如：Windows 11，Python 3.12，pip install -r requirements.txt
    validations:
      required: true
