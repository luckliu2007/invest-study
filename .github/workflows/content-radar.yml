name: Content Radar

on:
  schedule:
    # 避开整点高峰（整点任务常被 GitHub 推迟数小时），确保早于 02:30 UTC 的每日审核
    - cron: '41 21 * * *'   # 每天 21:41 UTC（北京时间次日 05:41）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  radar:
    uses: luckliu2007/content-radar/.github/workflows/radar.yml@main
