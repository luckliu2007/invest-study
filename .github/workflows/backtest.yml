name: CI

on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）。CI 在海外无法访问东方财富，跑的是示例数据，
    # 每天跑只会重复产出相同结果；每周一次用于发现依赖升级导致的破坏即可。
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'requirements-test.txt'
      - '.github/workflows/backtest.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/backtest.yml'

jobs:
  # 快速单元测试：只装轻量依赖，必须通过。覆盖脚本核心逻辑与降级路径。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run unit tests
        run: pytest tests/ -v

  # 冒烟运行：装完整 CI 依赖跑全部脚本，产出 reports/ 作为 artifact。
  # 重依赖（pyportfolioopt 等）安装失败时脚本自带降级路径，不应阻塞。
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps (best-effort)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt || pip install -r requirements-test.txt
      - name: Run all scripts
        env:
          INVEST_OFFLINE: "1"   # 海外 runner 访问不了东方财富，直接用示例数据，省去超时等待
        run: |
          python scripts/sector_screening.py
          python scripts/optimize_portfolio.py
          python scripts/fund_raise_tracker.py
          python scripts/exit_simulation.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          if-no-files-found: error
