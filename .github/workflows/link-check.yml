name: Link Check

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  pull_request:
    paths:
      - '**/*.md'
      - '.lycheeignore'
  schedule:
    - cron: '17 2 * * 1'   # 每周一 02:17 UTC（避开整点）
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 202/403：SSRN、GuruFocus、Class Central 等对爬虫返回挑战页，浏览器可正常访问
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,202,206,403,429
            --timeout 25
            --max-retries 3
            --retry-wait-time 5
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
